[package]
name = "bevy_escape_template"
version = "0.1.0"
edition = "2024"
description = ""
license = "MIT OR Apache-2.0"
repository = "https://github.com/unclepomedev/bevy_escape_template"

[dependencies]
bevy = { version = "0.19", features = ["debug"] }
bevy_escape_core = { path = "crates/bevy_escape_core" }

[workspace]
members = [".", "crates/bevy_escape_core"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
